<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一天的健康时钟</title>
<style>
  @font-face { font-family: Hand; src: url(fonts/lxgw-wenkai-subset.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #1d2320; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; flex: none; width: 1280px; height: 720px; background: #fffdf8; overflow: hidden;
           font-family: Hand, "WenQuanYi Zen Hei", "PingFang SC", sans-serif; cursor: pointer; }
  svg { position: absolute; inset: 0; }
  #badge { position: absolute; left: 20px; top: 14px; font-size: 22px; color: #757575;
           background: rgba(255, 253, 248, 0.92); padding: 4px 10px; border-radius: 10px; }
  #cap { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); white-space: nowrap;
         background: rgba(255, 255, 255, 0.95); border: 2.5px solid #1e1e1e; border-radius: 18px;
         padding: 8px 30px; font-size: 34px; color: #1e1e1e; box-shadow: 4px 5px 0 rgba(30, 30, 30, 0.12); }
  #fade { position: absolute; inset: 0; background: #fffdf8; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" width="1280" height="720" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="badge">小健的健康小招 · 讲解篇</div>
  <div id="cap"></div>
  <div id="fade"></div>
</div>
<script src="vendor/rough.js"></script>
<script>
// Excalidraw 风格的手绘讲解动画：元素按分镜顺序"一笔一笔"画出来，镜头跟着移动。
// render(t) 按时间绘制任意一帧，浏览器中直接播放，或用 render.js 导出为视频。
const W = 1280, H = 720, BG = '#fffdf8', INK = '#1e1e1e';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// ---------- 分镜 ----------
const beats = [];
const cam = (cx, cy, w, dur = 1.1) => beats.push({ cam: { x: cx - w / 2, y: cy - (w * 9 / 16) / 2, w, h: w * 9 / 16 }, dur });
const cap = text => beats.push({ cap: text });
const hold = s => beats.push({ hold: s });
const draw = (e, dur) => beats.push({ el: e, dur });
// 最后一个可选参数是绘制时长（秒）
const rect = (id, x, y, w, h, o = {}, dur) => draw({ type: 'rect', id, x, y, w, h, ...o }, dur);
const oval = (id, x, y, w, h, o = {}, dur) => draw({ type: 'ellipse', id, x, y, w, h, ...o }, dur);
const line = (id, x, y, dx, dy, o = {}, dur) => draw({ type: 'arrow', id, x, y, dx, dy, head: true, ...o }, dur);
const text = (id, x, y, str, size, color = INK, dur) => draw({ type: 'text', id, x, y, str, size, color }, dur);

const Y = { stroke: '#f59e0b', fill: '#fff3bf' }, G = { stroke: '#22c55e', fill: '#b2f2bb' };
const B = { stroke: '#4a9eed', fill: '#a5d8ff' }, P = { stroke: '#ec4899', fill: '#eebefa' };
const V = { stroke: '#8b5cf6', fill: '#d0bfff' }, O = { stroke: '#f59e0b', fill: '#ffd8a8' };

// 1. 标题
cam(400, 50, 800, 0.01);
cap('身体里有一座生物钟');
text('title', 288, 10, '一天的健康时钟', 32);
text('subtitle', 270, 60, '跟着生物钟，身体自己会变好', 20, '#757575');
hold(1.2);

// 2. 时间轴
cam(400, 200, 960);
cap('先把一天的关键时刻标出来');
rect('eatband', 360, 186, 640, 28, { ...G, sw: 1, op: 0.6 });
text('eatlbl', 606, 140, '进食窗口 8 小时', 18, '#15803d');
line('tline', 40, 200, 1460, 0, { stroke: INK, sw: 3 }, 1.2);
const mark = (id, hx, above, label, c) => {
  oval('d' + id, hx - 7, 193, 14, 14, { stroke: c.stroke, fill: c.stroke });
  rect('l' + id, hx - 75, above ? 120 : 232, 150, 44, { ...c, label, size: 16 });
};
mark('07', 120, true, '07:00 起床晒太阳', Y);
mark('08', 200, false, '08:00 可以吃了', G);
mark('10', 360, true, '10:00 进食开始', G);
mark('14', 680, false, '14:00 咖啡截止', O);
cam(1100, 200, 960);
mark('18', 1000, true, '18:00 进食结束', G);
rect('nightband', 1320, 186, 160, 28, { ...V, sw: 1, op: 0.6 });
mark('22', 1320, false, '22:00 调暗灯光', V);
mark('23', 1400, true, '23:00 入睡', V);
hold(0.6);
cam(770, 200, 1600, 1.3);
cap('每个时间点背后，都有身体的道理');
hold(1.6);

// 3. 五张原理卡
const card = (n, x, c, title, a, b, d, caption) => {
  cam(x + 140, 506, 800);
  cap(caption);
  rect('z' + n, x, 300, 280, 360, { ...c, sw: 1, op: 0.35 });
  rect('h' + n, x + 20, 315, 240, 50, { ...c, label: title, size: 22 });
  rect('a' + n, x + 30, 385, 220, 56, { stroke: c.stroke, fill: '#ffffff', label: a, size: 16 });
  line('x' + n, x + 140, 443, 0, 31, { stroke: c.stroke });
  rect('b' + n, x + 30, 476, 220, 56, { stroke: c.stroke, fill: '#ffffff', label: b, size: 16 });
  line('y' + n, x + 140, 534, 0, 31, { stroke: c.stroke });
  rect('c' + n, x + 30, 567, 220, 56, { ...c, label: d, size: 16 });
  hold(2.2);
};
card(1, 20, Y, '第 1 招 晨光', '户外日光 2–10 分钟', '释放皮质醇，白天有精神', '启动晚上的入睡倒计时', '早上的阳光，是一天的开关');
card(2, 330, G, '第 2 招 饮食', '8 小时内吃完，少吃糖', '血糖慢慢回落', '进入禁食状态', '吃饭有窗口，血糖才能歇一歇');
card(3, 640, B, '第 3 招 运动', '每天动一动', '饭后散步，加快血糖清理', '精神更好，脂肪变少', '动起来，身体清理得更快');
card(4, 950, P, '第 4 招 专注', '手机每天少于 2 小时', '少了频繁的信息切换', '多巴胺不透支，更专注', '少刷手机，专注力才不被透支');
card(5, 1260, V, '第 5 招 睡眠', '晚上 11 点后远离光', '保护生物钟和多巴胺', '睡足 6–8 小时', '夜里远离光，生物钟才不会乱');

// 4. 四原则
cam(760, 770, 1280, 1.3);
cap('记不住那么多？先做到这四点');
text('ftitle', 604, 700, '做到这四点，就已经很健康了', 26);
['保持睡眠', '不吸烟', '每天运动', '少吃糖'].forEach((s, i) =>
  rect('p' + i, 300 + i * 240, 760, 200, 70, { stroke: '#15803d', fill: '#b2f2bb', label: s, size: 24 }, 0.6));
hold(2);

// 5. 全景 + 点缀
cam(770, 500, 1920, 1.5);
cap('每天进步一点点，加油！');
oval('sun', 40, 30, 56, 56, Y);
[[68, 26, 0, -16], [68, 90, 0, 16], [36, 58, -16, 0], [100, 58, 16, 0]].forEach(([x, y, dx, dy], i) =>
  line('sr' + i, x, y, dx, dy, { stroke: '#f59e0b', head: false }, 0.2));
oval('moon', 1420, 30, 60, 60, Y);
oval('moonc', 1440, 20, 56, 56, { stroke: BG, fill: BG, sw: 1 }, 0.2);
text('note', 470, 850, '内容整理自本仓库文章（Huberman 等人的 podcast），仅供参考', 22, '#757575');
hold(3);

// ---------- 排时间 ----------
const els = [], camKeys = [], caps = [];
let t = 0.3;
const defaultDur = e => e.type === 'text' ? 0.3 + 0.035 * e.str.length
  : e.type === 'arrow' ? 0.35 : e.label ? 0.7 : 0.45;
for (const b of beats) {
  if (b.cam) { camKeys.push({ t0: t, t1: t + b.dur, to: b.cam }); t += b.dur * 0.7; }
  else if (b.cap) caps.push({ t, text: b.cap });
  else if (b.hold) t += b.hold;
  else { const e = b.el; e.at = t; e.dur = b.dur || defaultDur(e); els.push(e); t += e.dur * 0.85; }
}
const TOTAL = Math.ceil(t + 0.8);

// ---------- 构建 SVG ----------
const scene = document.createElementNS(NS, 'g');
svg.appendChild(scene);
const rc = rough.svg(svg);
const seedOf = id => [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 100000, 7) + 1;
const rr = (x, y, w, h, r) => `M${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r} L${x + w} ${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h} L${x + r} ${y + h} Q${x} ${y + h} ${x} ${y + h - r} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} Z`;

// 把 rough 生成的描边拆成单笔，便于做"画出来"的效果
function strokesOf(node, list) {
  node.querySelectorAll('path').forEach(p => {
    const stroke = p.getAttribute('stroke');
    if (!stroke || stroke === 'none') { list.fills.push(p); return; }
    const parts = p.getAttribute('d').split(/(?=M)/).filter(s => s.trim());
    parts.forEach(d => {
      const q = p.cloneNode(); q.setAttribute('d', d); q.setAttribute('pathLength', '1');
      q.style.strokeDasharray = '1 1'; q.setAttribute('stroke-linecap', 'round');
      p.parentNode.insertBefore(q, p); list.strokes.push(q);
    });
    p.remove();
  });
}

function addText(g, str, x, y, size, color, anchor) {
  const tx = document.createElementNS(NS, 'text');
  tx.textContent = str;
  tx.setAttribute('x', x); tx.setAttribute('y', y);
  tx.setAttribute('font-size', size); tx.setAttribute('fill', color);
  tx.setAttribute('font-family', 'Hand, "WenQuanYi Zen Hei", sans-serif');
  tx.setAttribute('text-anchor', anchor); tx.setAttribute('dominant-baseline', 'central');
  g.appendChild(tx);
  const bb = tx.getBBox();
  const clip = document.createElementNS(NS, 'clipPath');
  clip.id = 'clip' + Math.random().toString(36).slice(2);
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', bb.x - 4); r.setAttribute('y', bb.y - 6); r.setAttribute('height', bb.height + 12); r.setAttribute('width', 0);
  clip.appendChild(r); g.appendChild(clip);
  tx.setAttribute('clip-path', `url(#${clip.id})`);
  return { rect: r, width: bb.width + 8 };
}

function build(e) {
  const g = document.createElementNS(NS, 'g');
  scene.appendChild(g);
  e.g = g; e.strokes = []; e.fills = []; e.heads = { strokes: [], fills: [] };
  const opts = { seed: seedOf(e.id), roughness: 1, bowing: 1, stroke: e.stroke || INK, strokeWidth: e.sw || 2 };
  if (e.fill) Object.assign(opts, { fill: e.fill, fillStyle: 'solid' });
  let node;
  if (e.type === 'rect') node = rc.path(rr(e.x, e.y, e.w, e.h, Math.min(16, e.h / 3)), opts);
  else if (e.type === 'ellipse') node = rc.ellipse(e.x + e.w / 2, e.y + e.h / 2, e.w, e.h, opts);
  else if (e.type === 'arrow') {
    node = rc.line(e.x, e.y, e.x + e.dx, e.y + e.dy, opts);
    if (e.head) {
      const a = Math.atan2(e.dy, e.dx), ex = e.x + e.dx, ey = e.y + e.dy, L = 16;
      const hg = document.createElementNS(NS, 'g');
      [a + 2.6, a - 2.6].forEach(b => hg.appendChild(rc.line(ex, ey, ex + Math.cos(b) * L, ey + Math.sin(b) * L, opts)));
      g.appendChild(hg); strokesOf(hg, e.heads);
    }
  }
  if (node) { g.insertBefore(node, g.firstChild); strokesOf(node, e); }
  if (e.label) e.txt = addText(g, e.label, e.x + e.w / 2, e.y + e.h / 2 + 1, e.size || 16, INK, 'middle');
  if (e.type === 'text') e.txt = addText(g, e.str, e.x, e.y + e.size * 0.6, e.size, e.color, 'start');
}

// ---------- 渲染 ----------
const capEl = document.getElementById('cap'), fadeEl = document.getElementById('fade');
let lastCap = null;
function render(time) {
  const tt = clamp(time, 0, TOTAL);
  // 镜头
  let c = camKeys[0].to;
  for (const k of camKeys) {
    if (tt >= k.t1) c = k.to;
    else if (tt > k.t0) { const p = ease((tt - k.t0) / (k.t1 - k.t0)); c = { x: lerp(c.x, k.to.x, p), y: lerp(c.y, k.to.y, p), w: lerp(c.w, k.to.w, p), h: lerp(c.h, k.to.h, p) }; break; }
    else break;
  }
  svg.setAttribute('viewBox', `${c.x} ${c.y} ${c.w} ${c.h}`);
  // 元素
  for (const e of els) {
    const p = clamp((tt - e.at) / e.dur);
    e.g.style.display = p <= 0 ? 'none' : '';
    if (p <= 0) continue;
    e.g.style.opacity = e.op ?? 1;
    const hasText = !!e.txt && e.type !== 'text';
    const sp = clamp(p / (hasText ? 0.6 : 0.85));
    e.strokes.forEach(s => { s.style.strokeDashoffset = 1 - sp; });
    e.fills.forEach(f => { f.style.opacity = clamp((sp - 0.3) / 0.6); });
    const hp = clamp((p - 0.75) / 0.25);
    e.heads.strokes.forEach(s => { s.style.strokeDashoffset = 1 - hp; });
    if (e.txt) {
      const tp = e.type === 'text' ? p : clamp((p - 0.55) / 0.45);
      e.txt.rect.setAttribute('width', e.txt.width * tp);
    }
  }
  // 字幕
  let cur = null;
  for (const k of caps) if (tt >= k.t) cur = k;
  if (cur !== lastCap) { capEl.textContent = cur ? cur.text : ''; lastCap = cur; }
  capEl.style.visibility = cur ? 'visible' : 'hidden';
  capEl.style.opacity = cur ? clamp((tt - cur.t) / 0.35) : 0;
  // 开头结尾淡入淡出
  fadeEl.style.opacity = Math.max(clamp(1 - tt / 0.3), clamp((tt - (TOTAL - 0.8)) / 0.8));
}

window.TOTAL = TOTAL;
window.SIZE = { width: W, height: H };
window.ready = document.fonts.load('32px Hand', '一天的健康时钟').then(() => {
  els.forEach(build);
  window.render = render;
  render(0);
});

// 浏览器中直接播放（点击重新开始）
if (!location.search.includes('export')) {
  const stage = document.getElementById('stage');
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; };
  addEventListener('resize', fit); fit();
  window.ready.then(() => {
    let start = performance.now();
    stage.addEventListener('click', () => { start = performance.now(); });
    const loop = now => { render(((now - start) / 1000) % (TOTAL + 1.5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
